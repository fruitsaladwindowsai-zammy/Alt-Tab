<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDeep" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#131c31" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#090e1a" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="violetAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#60cdff"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>
  <style>
    @keyframes glideFront {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(8px, -6px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    .anim-front { animation: glideFront 4.2s infinite ease-in-out; }
    .anim-pulse { animation: pulseDot 2.4s infinite ease-in-out; }
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Consolas', 'Fira Code', monospace; }
  </style>

  <rect width="1200" height="750" fill="url(#bgDeep)"/>

  <!-- Header Badge -->
  <g transform="translate(600, 48)">
    <rect x="-315" y="-18" width="630" height="36" rx="18" fill="#0d1424" stroke="url(#cyanAccent)" stroke-width="1.5"/>
    <circle cx="-288" cy="0" r="5" fill="#00f5d4" class="anim-pulse"/>
    <text x="-272" y="4" fill="#f8fafc" font-size="13" font-weight="700">The Deep — Spatial-Temporal Logarithmic Recency Stack</text>
    <text x="178" y="4" fill="#00f5d4" font-size="11" class="mono" font-weight="700">d = log2(1 + t/30)</text>
  </g>

  <!-- Perspective Z-Axis Guide -->
  <line x1="210" y1="530" x2="960" y2="160" stroke="#00f5d4" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="975" y="165" fill="#60cdff" font-size="12" class="mono" font-weight="700">z -> 8.0 fathoms (2h+)</text>
  <text x="95" y="548" fill="#00f5d4" font-size="12" class="mono" font-weight="700">z = 0.0 (now)</text>

  <!-- Depth Card 4 (Farthest, heavy fog 0.56) -->
  <g transform="translate(690, 145)" opacity="0.40">
    <rect width="300" height="190" rx="12" fill="#131c2e" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="30" rx="12" fill="#1c2740"/>
    <text x="14" y="20" fill="#cbd5e1" font-size="11" font-weight="600">Photos — Iceland, 2026</text>
    <text x="286" y="20" fill="#94a3b8" font-size="10" class="mono" text-anchor="end">5.4 fth · fog 43%</text>
    <rect x="16" y="46" width="268" height="128" rx="6" fill="#0d1524"/>
  </g>

  <!-- Depth Card 3 (Mid-deep, fog 0.28) -->
  <g transform="translate(540, 210)" opacity="0.64">
    <rect width="340" height="215" rx="12" fill="#131d31" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="32" rx="12" fill="#1e2b45"/>
    <text x="16" y="21" fill="#e2e8f0" font-size="12" font-weight="600">Music — Low Tide</text>
    <text x="324" y="21" fill="#94a3b8" font-size="10" class="mono" text-anchor="end">2.6 fth · fog 21%</text>
    <rect x="16" y="48" width="308" height="150" rx="6" fill="#0d1524"/>
  </g>

  <!-- Depth Card 2 (Previous window, fog 0.11) -->
  <g transform="translate(370, 285)" opacity="0.86" filter="url(#cardShadow)">
    <rect width="380" height="240" rx="13" fill="#152138" stroke="#60cdff" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="34" rx="13" fill="#1e3050"/>
    <text x="16" y="22" fill="#f1f5f9" font-size="12" font-weight="600">Browser — Documentation</text>
    <text x="364" y="22" fill="#60cdff" font-size="10" class="mono" text-anchor="end">1.3 fth · 45s ago</text>
    <rect x="16" y="48" width="348" height="174" rx="8" fill="#0b1322"/>
    <rect x="30" y="64" width="180" height="10" rx="4" fill="#334155"/>
    <rect x="30" y="84" width="300" height="8" rx="4" fill="#1e293b"/>
    <rect x="30" y="100" width="260" height="8" rx="4" fill="#1e293b"/>
    <rect x="30" y="124" width="140" height="72" rx="6" fill="#15243b"/>
    <rect x="186" y="124" width="140" height="72" rx="6" fill="#15243b"/>
  </g>

  <!-- Depth Card 1 (Active / Selected Front Plane, 0% fog) -->
  <g transform="translate(170, 355)" class="anim-front" filter="url(#cardShadow)">
    <rect width="430" height="265" rx="14" fill="#16243d" stroke="url(#cyanAccent)" stroke-width="2.5" filter="url(#glowCyan)"/>
    <rect x="2" y="2" width="426" height="38" rx="12" fill="#1d3154"/>
    <circle cx="22" cy="21" r="7" fill="#00f5d4"/>
    <text x="38" y="25" fill="#ffffff" font-size="13" font-weight="700">VS Code — src/controller.rs</text>
    <text x="412" y="25" fill="#00f5d4" font-size="11" class="mono" font-weight="700" text-anchor="end">0.0 fth · just now</text>
    <rect x="16" y="52" width="398" height="196" rx="8" fill="#0b1220"/>
    <text x="30" y="82" fill="#00f5d4" font-size="12" class="mono">pub fn depth_for_seconds(s: f64) -&gt; f64 {</text>
    <text x="44" y="106" fill="#cbd5e1" font-size="12" class="mono">clamp_depth((1.0 + s / 30.0).log2())</text>
    <text x="30" y="130" fill="#00f5d4" font-size="12" class="mono">}</text>
    <rect x="30" y="152" width="368" height="78" rx="8" fill="#121e33" stroke="#00f5d4" stroke-opacity="0.3"/>
    <text x="46" y="178" fill="#f8fafc" font-size="12" font-weight="700">Camera Motion: 220ms OutCubic Glide</text>
    <text x="46" y="200" fill="#94a3b8" font-size="11" class="mono">eased(t) = 1 - (1 - t)^3  |  fog = depth * 0.08</text>
    <text x="46" y="218" fill="#60cdff" font-size="11" class="mono">Render Engine: Direct3D 11 + Direct2D + DirectWrite</text>
  </g>

  <!-- Right Spec Card -->
  <g transform="translate(830, 415)" filter="url(#cardShadow)">
    <rect width="320" height="275" rx="14" fill="#0d1526" stroke="url(#violetAccent)" stroke-width="1.5"/>
    <text x="22" y="34" fill="#60cdff" font-size="13" font-weight="700">FATHOM DEPTH SCALE</text>
    <line x1="20" y1="48" x2="300" y2="48" stroke="#334155" stroke-width="1"/>
    <text x="22" y="76" fill="#00f5d4" font-size="12" class="mono">0.0 fth  =&gt;  0s   (now)</text>
    <text x="22" y="102" fill="#e2e8f0" font-size="12" class="mono">1.0 fth  =&gt;  30s  (fog 8%)</text>
    <text x="22" y="128" fill="#e2e8f0" font-size="12" class="mono">2.0 fth  =&gt;  90s  (fog 16%)</text>
    <text x="22" y="154" fill="#cbd5e1" font-size="12" class="mono">4.0 fth  =&gt;  7.5m (fog 32%)</text>
    <text x="22" y="180" fill="#94a3b8" font-size="12" class="mono">6.0 fth  =&gt;  31m  (fog 48%)</text>
    <text x="22" y="206" fill="#64748b" font-size="12" class="mono">8.0 fth  =&gt;  2h+  (fog 64%)</text>
    <rect x="20" y="224" width="280" height="34" rx="8" fill="#15233d"/>
    <text x="160" y="246" fill="#00f5d4" font-size="11" class="mono" text-anchor="middle">t(d) = 30 * (2^d - 1) seconds</text>
  </g>
</svg>
