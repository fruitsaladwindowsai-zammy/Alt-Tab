<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHook" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="65%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#60cdff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes flowPacket {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .anim-flow { stroke-dasharray: 10 5; animation: flowPacket 1.4s linear infinite; }
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Consolas', 'Fira Code', monospace; }
  </style>

  <rect width="1200" height="750" fill="url(#bgHook)"/>

  <!-- Header Badge -->
  <g transform="translate(600, 48)">
    <rect x="-335" y="-18" width="670" height="36" rx="18" fill="#0d1424" stroke="url(#pipeGrad)" stroke-width="1.5"/>
    <circle cx="-308" cy="0" r="5" fill="#00f5d4"/>
    <text x="-292" y="4" fill="#f8fafc" font-size="13" font-weight="700">Zero-Flash 90ms Hold Reveal &amp; Dedicated WH_KEYBOARD_LL Thread</text>
  </g>

  <!-- Thread 1: Dedicated Hook Thread -->
  <g transform="translate(80, 115)">
    <rect width="320" height="250" rx="14" fill="#0e172a" stroke="#00f5d4" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="38" rx="14" fill="#14293d"/>
    <text x="18" y="24" fill="#00f5d4" font-size="12" font-weight="700" class="mono">THREAD: winscroller-kb-hook</text>
    <text x="18" y="68" fill="#f8fafc" font-size="13" font-weight="700">WH_KEYBOARD_LL (O(1) Non-Blocking)</text>
    <text x="18" y="94" fill="#cbd5e1" font-size="12">• Swallows Alt+Tab before Windows Task</text>
    <text x="28" y="112" fill="#cbd5e1" font-size="12">Switcher can open</text>
    <text x="18" y="138" fill="#cbd5e1" font-size="12">• Passes physical Alt down/up through</text>
    <text x="28" y="156" fill="#cbd5e1" font-size="12">CallNextHookEx so Alt NEVER sticks</text>
    <text x="18" y="182" fill="#cbd5e1" font-size="12">• Intercepts Esc/Space/Tab during &lt;90ms</text>
    <text x="28" y="200" fill="#cbd5e1" font-size="12">grace window (zero leaked keys)</text>
    <rect x="18" y="212" width="284" height="26" rx="6" fill="#132238"/>
    <text x="160" y="229" fill="#00f5d4" font-size="11" class="mono" text-anchor="middle">PostMessageW -&gt; UI Thread</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="400" y1="240" x2="465" y2="240" stroke="#00f5d4" stroke-width="3" class="anim-flow"/>
  <polygon points="472,240 460,233 460,247" fill="#00f5d4"/>

  <!-- Thread 2: UI / Controller State Machine -->
  <g transform="translate(475, 115)">
    <rect width="340" height="250" rx="14" fill="#0e172a" stroke="#60cdff" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="38" rx="14" fill="#172a47"/>
    <text x="18" y="24" fill="#60cdff" font-size="12" font-weight="700" class="mono">MAIN THREAD: Controller + D2D</text>
    <text x="18" y="68" fill="#f8fafc" font-size="13" font-weight="700">Hold / Browse State Machine</text>
    <text x="18" y="96" fill="#cbd5e1" font-size="12">• WM_FATHOM_CHORD_STEP (+1 / -1)</text>
    <text x="18" y="120" fill="#cbd5e1" font-size="12">• WM_FATHOM_ALT_RELEASE (commit)</text>
    <text x="18" y="144" fill="#cbd5e1" font-size="12">• WM_FATHOM_OPEN_BROWSE (pin)</text>
    <text x="18" y="168" fill="#cbd5e1" font-size="12">• SetWinEventHook recency timestamps</text>
    <rect x="18" y="186" width="304" height="50" rx="8" fill="#132036" stroke="#60cdff" stroke-opacity="0.4"/>
    <text x="30" y="207" fill="#00f5d4" font-size="11" class="mono">Atomic flags synced to hook thread:</text>
    <text x="30" y="225" fill="#94a3b8" font-size="11" class="mono">FATHOM_OPEN | FATHOM_REVEALED | HOLDING</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="815" y1="240" x2="880" y2="240" stroke="#8b5cf6" stroke-width="3" class="anim-flow"/>
  <polygon points="887,240 875,233 875,247" fill="#8b5cf6"/>

  <!-- Safety Watchdog -->
  <g transform="translate(890, 115)">
    <rect width="230" height="250" rx="14" fill="#13142a" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="38" rx="14" fill="#221b47"/>
    <text x="18" y="24" fill="#c084fc" font-size="12" font-weight="700" class="mono">SAFETY GUARD</text>
    <text x="18" y="72" fill="#f8fafc" font-size="13" font-weight="700">15s Inactivity Watchdog</text>
    <text x="18" y="98" fill="#cbd5e1" font-size="12">If Alt release is missed</text>
    <text x="18" y="116" fill="#cbd5e1" font-size="12">during UAC/lockscreen,</text>
    <text x="18" y="134" fill="#cbd5e1" font-size="12">Hold mode self-cancels.</text>
    <text x="18" y="170" fill="#f8fafc" font-size="13" font-weight="700">12ms Tick Poll</text>
    <text x="18" y="196" fill="#94a3b8" font-size="12">Verifies GetAsyncKeyState</text>
    <text x="18" y="214" fill="#94a3b8" font-size="12">so Alt release always fires.</text>
  </g>

  <!-- Bottom Timeline: 90ms Grace Window -->
  <g transform="translate(80, 415)">
    <rect width="1040" height="275" rx="16" fill="#0c1322" stroke="#1e293b" stroke-width="2"/>
    <text x="28" y="38" fill="#00f5d4" font-size="14" font-weight="700">90ms ZERO-FLASH HOLD TIMELINE</text>

    <!-- Timeline Axis -->
    <line x1="60" y1="115" x2="980" y2="115" stroke="#334155" stroke-width="4"/>
    <rect x="60" y="109" width="290" height="12" rx="6" fill="#00f5d4"/>
    <rect x="350" y="109" width="320" height="12" rx="6" fill="#60cdff"/>
    <rect x="670" y="109" width="310" height="12" rx="6" fill="#8b5cf6"/>

    <!-- Milestones -->
    <circle cx="60" cy="115" r="9" fill="#00f5d4"/>
    <text x="60" y="88" fill="#00f5d4" font-size="12" class="mono" font-weight="700">0ms: Alt+Tab</text>

    <circle cx="350" cy="115" r="9" fill="#60cdff"/>
    <text x="350" y="88" fill="#60cdff" font-size="12" class="mono" font-weight="700" text-anchor="middle">90ms: Reveal Timer</text>

    <circle cx="670" cy="115" r="9" fill="#c084fc"/>
    <text x="670" y="88" fill="#c084fc" font-size="12" class="mono" font-weight="700" text-anchor="middle">220ms: Full Overlay</text>

    <circle cx="980" cy="115" r="9" fill="#f8fafc"/>
    <text x="980" y="88" fill="#f8fafc" font-size="12" class="mono" font-weight="700" text-anchor="end">Release Alt / Space</text>

    <!-- Phase Cards -->
    <g transform="translate(60, 145)">
      <rect width="275" height="105" rx="10" fill="#10242c" stroke="#00f5d4" stroke-opacity="0.5"/>
      <text x="16" y="28" fill="#00f5d4" font-size="13" font-weight="700">Fast Tap (&lt; 90ms)</text>
      <text x="16" y="52" fill="#e2e8f0" font-size="12">Release Alt early -&gt; instantly</text>
      <text x="16" y="70" fill="#e2e8f0" font-size="12">switches to previous window</text>
      <text x="16" y="88" fill="#00f5d4" font-size="11" class="mono">ZERO visual flash!</text>
    </g>

    <g transform="translate(360, 145)">
      <rect width="295" height="105" rx="10" fill="#112036" stroke="#60cdff" stroke-opacity="0.5"/>
      <text x="16" y="28" fill="#60cdff" font-size="13" font-weight="700">Hold Reveal (90ms -&gt; 220ms)</text>
      <text x="16" y="52" fill="#e2e8f0" font-size="12">Overlay fades in (130ms OutCubic)</text>
      <text x="16" y="70" fill="#e2e8f0" font-size="12">over blurred desktop wallpaper</text>
      <text x="16" y="88" fill="#60cdff" font-size="11" class="mono">Tab / Arrows step through The Deep</text>
    </g>

    <g transform="translate(680, 145)">
      <rect width="300" height="105" rx="10" fill="#1a1836" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="16" y="28" fill="#c084fc" font-size="13" font-weight="700">Pin to Browse (Space / Alt+`)</text>
      <text x="16" y="52" fill="#e2e8f0" font-size="12">Press Space while holding Alt to</text>
      <text x="16" y="70" fill="#e2e8f0" font-size="12">pin open for typing search filters</text>
      <text x="16" y="88" fill="#c084fc" font-size="11" class="mono">or dragging windows across desktops</text>
    </g>
  </g>
</svg>
