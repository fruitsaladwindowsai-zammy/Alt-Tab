[package]
name = "winscroller-alt-tab"
version = "0.1.0"
edition = "2024"
authors = ["Winscroller Alt+Tab contributors"]
description = "Winscroller Alt+Tab — Depth-based Alt+Tab window switcher and Virtual Desktop workspace organizer for Windows 10/11, built in pure Rust with Direct3D 11 and Direct2D"
license = "MIT"
repository = "https://github.com/fruitsaladwindowsai-zammy/Alt-Tab"
homepage = "https://fruitsaladwindowsai-zammy.github.io/Alt-Tab/"
readme = "README.md"
keywords = ["windows", "alt-tab", "window-switcher", "virtual-desktop", "direct2d"]
categories = ["os::windows-apis", "gui"]

[dependencies]
windows = { version = "0.62", features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
